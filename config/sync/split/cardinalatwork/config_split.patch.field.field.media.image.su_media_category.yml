adding:
  dependencies:
    config:
      - taxonomy.vocabulary.media
  description: 'Add a category for the image to find it later more easily.'
  settings:
    handler_settings:
      target_bundles:
        media: media
removing:
  dependencies:
    config:
      - taxonomy.vocabulary.media_tags
  description: 'Categorize the media to help find the media at a later time.'
  settings:
    handler_settings:
      target_bundles:
        media_tags: media_tags
