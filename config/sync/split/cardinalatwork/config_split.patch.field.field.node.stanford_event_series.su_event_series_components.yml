adding:
  dependencies:
    config:
      - paragraphs.paragraphs_type.layout
  settings:
    handler_settings:
      target_bundles:
        layout: layout
      target_bundles_drag_drop:
        layout:
          weight: 15
          enabled: true
        stanford_faq:
          weight: 20
          enabled: false
        stanford_layout:
          enabled: false
removing:
  dependencies:
    config:
      - paragraphs.paragraphs_type.stanford_layout
  settings:
    handler_settings:
      target_bundles:
        stanford_layout: stanford_layout
      target_bundles_drag_drop:
        stanford_layout:
          enabled: true
