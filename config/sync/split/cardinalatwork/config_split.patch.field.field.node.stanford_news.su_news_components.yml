adding:
  dependencies:
    config:
      - paragraphs.paragraphs_type.layout
      - paragraphs.paragraphs_type.stanford_accordion
  settings:
    handler_settings:
      target_bundles:
        stanford_accordion: stanford_accordion
        layout: layout
      target_bundles_drag_drop:
        stanford_accordion:
          enabled: true
        stanford_filtered_lists:
          weight: 24
          enabled: false
        stanford_layout:
          weight: 26
          enabled: false
        stanford_stat_card:
          weight: 33
          enabled: false
removing:
  dependencies:
    config:
      - paragraphs.paragraphs_type.stanford_layout
  settings:
    handler_settings:
      target_bundles_drag_drop:
        stanford_accordion:
          enabled: false
