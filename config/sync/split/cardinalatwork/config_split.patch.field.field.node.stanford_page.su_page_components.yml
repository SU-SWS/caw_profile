adding:
  dependencies:
    config:
      - paragraphs.paragraphs_type.layout
      - paragraphs.paragraphs_type.stanford_accordion
  settings:
    handler_settings:
      target_bundles:
        stanford_accordion: stanford_accordion
        layout: layout
      target_bundles_drag_drop:
        layout:
          weight: 16
          enabled: true
        stanford_accordion:
          enabled: true
        stanford_layout:
          enabled: false
removing:
  dependencies:
    config:
      - paragraphs.paragraphs_type.stanford_layout
  settings:
    handler_settings:
      target_bundles:
        stanford_layout: stanford_layout
      target_bundles_drag_drop:
        stanford_accordion:
          enabled: false
        stanford_layout:
          enabled: true
