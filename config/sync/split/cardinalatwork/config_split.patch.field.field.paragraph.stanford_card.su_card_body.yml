adding:
  dependencies:
    module:
      - allowed_formats
  third_party_settings:
    allowed_formats:
      stanford_limited_html: stanford_limited_html
      stanford_minimal_html: stanford_minimal_html
      stanford_html: '0'
      plain_text: '0'
removing:
  dependencies:
    config:
      - filter.format.stanford_minimal_html
  settings:
    allowed_formats:
      - stanford_minimal_html
