process:
  title: title
  status:
    plugin: default_value
    source: published
    default_value: 1
  su_benefit_type:
    - plugin: skip_on_empty
      method: row
      source: type
    - plugin: callback
      callable: strtolower
  su_benefits_year:
    - plugin: skip_on_empty
      method: row
      source: year
    - plugin: str_replace
      regex: true
      search: /^(\d+)$/
      replace: $1-01-01
  su_benefits_offered:
    - plugin: skip_on_empty
      method: row
      source: offeredTo
    - plugin: str_replace
      case_insensitive: true
      search:
        - Employees
        - 'Non-Medicare Retirees'
        - 'Medicare Retirees'
      replace:
        - active
        - early_retirees
        - retirees
  caw_benefits_prosthetic:
    - plugin: skip_on_empty
      method: process
      source: prostheticOrthoticDevices
    - plugin: str_replace
      search: '/<br ?\/>/'
      replace: "\r\n"
      regex: true
