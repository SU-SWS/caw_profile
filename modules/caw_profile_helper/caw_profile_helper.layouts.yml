caw_one_column:
  label: 'One column'
  category: 'CAW Layouts'
  class: '\Drupal\stanford_layout_paragraphs\Layouts\OneColumn'
  template: templates/layouts/caw-one-column
  library: stanford_layout_paragraphs/one_column
  default_region: first
  icon_map:
    - [first]
  regions:
    first:
      label: Main content
caw_two_column:
  label: 'Two column'
  category: 'CAW Layouts'
  class: '\Drupal\stanford_layout_paragraphs\Layouts\TwoColumn'
  template: templates/layouts/caw-two-column
  library: stanford_layout_paragraphs/two_column
  default_region: first
  icon_map:
    - [ first, second ]
  regions:
    first:
      label: Left
    second:
      label: Right
caw_three_column:
  label: 'Three column'
  category: 'CAW Layouts'
  class: '\Drupal\stanford_layout_paragraphs\Layouts\ThreeColumn'
  template: templates/layouts/caw-three-column
  library: stanford_layout_paragraphs/three_column
  default_region: second
  icon_map:
    - [ first, second, third ]
  regions:
    first:
      label: Left
    second:
      label: Center
    third:
      label: Right
